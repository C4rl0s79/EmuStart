name: Klucz podpisu (jednorazowo)

# Tworzy klucz podpisu APK chroniony hasłem z sekretu ANDROID_KEYSTORE_PASSWORD
# (bez hasła plik jest bezużyteczny). Artefakt pobiera się raz i usuwa.
on:
  workflow_dispatch:

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Klucz
        env:
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$PW"
          keytool -genkeypair -keystore emustart.keystore -storetype PKCS12 \
            -alias emustart -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=EmuStart, O=C4rl0s79" -storepass "$PW" -keypass "$PW"
      - uses: actions/upload-artifact@v4
        with:
          name: emustart-keystore
          path: emustart.keystore
          retention-days: 1
